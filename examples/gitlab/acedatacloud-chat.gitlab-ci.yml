stages:
  - report

acedatacloud_commit_summary:
  stage: report
  image: alpine:3.23
  variables:
    GIT_STRATEGY: none
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true
    - when: never
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      set -eu
      set +x
      umask 077
      : "${ACEDATACLOUD_API_TOKEN:?Set a masked CI/CD variable}"
      : "${CI_COMMIT_TITLE:?GitLab did not provide a commit title}"
      rm -f summary.txt
      request_file="$(mktemp)"
      response_file="$(mktemp)"
      trap 'rm -f "$request_file" "$response_file"' 0
      jq -n --arg title "$CI_COMMIT_TITLE" '{
        model: "gpt-5.5",
        messages: [{role: "user", content: ("Summarize this commit title in one sentence: " + $title)}],
        stream: false
      }' > "$request_file"
      if ! status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
        --connect-timeout 10 --max-time 120 --retry 0 \
        --header "Authorization: Bearer $ACEDATACLOUD_API_TOKEN" \
        --header 'Content-Type: application/json' \
        --data-binary "@$request_file" \
        https://api.acedata.cloud/v1/chat/completions)"; then
        echo 'AceDataCloud request failed before an HTTP response. Its billing outcome is unknown; check usage before retrying.' >&2
        exit 1
      fi
      case "$status" in
        2??) ;;
        *) echo "AceDataCloud returned HTTP $status. Check the token, model, limits and account balance before retrying." >&2; exit 1 ;;
      esac
      if ! jq -er '.choices[0].message.content | select(type == "string" and length > 0)' "$response_file" > summary.txt; then
        rm -f summary.txt
        echo 'AceDataCloud returned no text summary. Check usage before retrying.' >&2
        exit 1
      fi
  artifacts:
    when: on_success
    access: developer
    paths:
      - summary.txt
    expire_in: 1 day
