stages:
  - report

acedatacloud_commit_summary:
  stage: report
  image: alpine:3.23
  variables:
    GIT_STRATEGY: none
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
    - when: never
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      set -eu
      : "${ACEDATACLOUD_API_TOKEN:?Set a masked CI/CD variable}"
      jq -n --arg title "$CI_COMMIT_TITLE" '{
        model: "gpt-5.5",
        messages: [{role: "user", content: ("Summarize this commit title in one sentence: " + $title)}],
        stream: false
      }' > request.json
      curl --fail-with-body --silent --show-error --retry 0 \
        -H "Authorization: Bearer $ACEDATACLOUD_API_TOKEN" \
        -H "Content-Type: application/json" \
        --data @request.json \
        https://api.acedata.cloud/v1/chat/completions > response.json
      jq -er '.choices[0].message.content | select(type == "string" and length > 0)' response.json > summary.txt
  artifacts:
    paths:
      - summary.txt
    expire_in: 1 day
