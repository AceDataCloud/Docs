include:
  - local: templates/commit-summary.yml

stages:
  - test
  - release

verify-component:
  stage: test
  image: ruby:3.4-alpine
  before_script:
    - apk add --no-cache jq
  script:
    - ruby tests/verify_component.rb

publish-component:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  script:
    - echo "Publishing AceDataCloud component $CI_COMMIT_TAG"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'AceDataCloud CI component $CI_COMMIT_TAG'
    description: 'AceDataCloud commit-summary component $CI_COMMIT_TAG'
