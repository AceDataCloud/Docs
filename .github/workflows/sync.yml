name: Sync Docs from PlatformBackend

on:
  repository_dispatch:
    types: [sync-docs, platform-contracts-updated]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      changed_services: ${{ steps.changes.outputs.changed_services }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - name: Checkout Docs repo
        uses: actions/checkout@v4
        with:
          path: Docs
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Resolve PlatformBackend ref
        id: backend
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TYPE: ${{ github.event.action }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ] && [ "$EVENT_TYPE" = "platform-contracts-updated" ]; then
            if ! printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::Direct contract events require a full PlatformBackend source_sha."
              exit 1
            fi
            echo "ref=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
            echo "direct=true" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "direct=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PlatformBackend
        uses: actions/checkout@v4
        with:
          repository: AceDataCloud/PlatformBackend
          ref: ${{ steps.backend.outputs.ref }}
          path: PlatformBackend
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Verify PlatformBackend source
        if: steps.backend.outputs.direct == 'true'
        run: |
          actual=$(git -C PlatformBackend rev-parse HEAD)
          test "$actual" = "${{ steps.backend.outputs.ref }}"
          bundle=$(mktemp -d)
          python PlatformBackend/scripts/ecosystem_contracts.py \
            --backend-dir PlatformBackend compile \
            --output-dir "$bundle" \
            --source-sha "$actual"
          python PlatformBackend/scripts/ecosystem_contracts.py verify \
            --bundle-dir "$bundle" \
            --source-sha "$actual"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run sync script
        working-directory: Docs
        env:
          PUBLIC_EXAMPLE_DENYLIST: ${{ secrets.PUBLIC_EXAMPLE_DENYLIST }}
        run: |
          python -u scripts/sync_from_platformbackend.py \
            --backend-dir ../PlatformBackend \
            --output-dir .

      - name: Check for changes
        id: changes
        working-directory: Docs
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "changed_services=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          changed_files=$(git diff --cached --name-only | head -300)
          echo "Files changed:"
          echo "$changed_files"

          changed_services=$(echo "$changed_files" \
            | grep -oP '^(?:openapi/|[^/]+/guides/|[^/]+/mcp/)\K[^/.]+' \
            | sort -u \
            | tr '\n' ',' \
            | sed 's/,$//' || true)
          echo "changed_services=$changed_services" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        id: commit
        if: steps.changes.outputs.changed == 'true'
        working-directory: Docs
        run: |
          git config user.name "Ace Data Cloud Dev"
          git config user.email "dev@acedata.cloud"
          git commit -m "docs: sync from PlatformBackend [automated]"
          git push
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
