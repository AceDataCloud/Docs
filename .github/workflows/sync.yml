name: Sync Docs from PlatformBackend

on:
  repository_dispatch:
    types: [sync-docs]
  workflow_dispatch:
    inputs:
      force:
        description: 'Force full regeneration'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Docs repo
        uses: actions/checkout@v4
        with:
          path: Docs
          token: ${{ secrets.BOT_TOKEN }}

      - name: Checkout PlatformBackend
        uses: actions/checkout@v4
        with:
          repository: AceDataCloud/PlatformBackend
          path: PlatformBackend
          token: ${{ secrets.BOT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run sync script
        run: |
          cd Docs
          python scripts/sync.py \
            --backend-dir ../PlatformBackend \
            --output-dir .

      - name: Check for changes
        id: changes
        working-directory: Docs
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Files changed:"
            git diff --cached --name-only | head -50
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        working-directory: Docs
        run: |
          git config user.name "Ace Data Cloud Dev"
          git config user.email "dev@acedata.cloud"
          git commit -m "docs: sync from PlatformBackend [automated]"
          git push
