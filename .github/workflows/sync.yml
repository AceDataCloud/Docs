name: Sync Docs from PlatformBackend

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/sync.yml'
  repository_dispatch:
    types: [platform-contracts-updated]
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"

concurrency:
  group: docs-publication-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      changed_services: ${{ steps.changes.outputs.changed_services }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - name: Checkout Docs repo
        uses: actions/checkout@v4
        with:
          path: Docs
          ref: main
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Checkout current PlatformBackend source
        uses: actions/checkout@v4
        with:
          repository: AceDataCloud/PlatformBackend
          ref: main
          fetch-depth: 0
          path: PlatformBackend
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Verify source event and current contract
        id: backend
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
        run: |
          actual=$(git -C PlatformBackend rev-parse HEAD)
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            if ! printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::Contract events require a full source_sha."
              exit 1
            fi
            # An old queued event is a reconciliation signal, never permission
            # to replay an older snapshot over newer published content.
            git -C PlatformBackend merge-base --is-ancestor "$SOURCE_SHA" "$actual"
          fi
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          bundle=$(mktemp -d)
          python PlatformBackend/scripts/ecosystem_contracts.py \
            --backend-dir PlatformBackend compile --output-dir "$bundle" --source-sha "$actual"
          python PlatformBackend/scripts/ecosystem_contracts.py verify \
            --bundle-dir "$bundle" --source-sha "$actual"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconcile public documents
        id: publication
        working-directory: Docs
        env:
          PUBLIC_EXAMPLE_DENYLIST: ${{ secrets.PUBLIC_EXAMPLE_DENYLIST }}
        run: |
          set +e
          python -u scripts/sync_from_platformbackend.py \
            --backend-dir ../PlatformBackend \
            --output-dir . \
            --report "$RUNNER_TEMP/docs-sync-report.json"
          result=$?
          set -e
          if [ "$result" -ne 0 ] && [ "$result" -ne 2 ]; then
            exit "$result"
          fi
          echo "incomplete=$([ "$result" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          python - "$RUNNER_TEMP/docs-sync-report.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          print(f"Current document versions: {report['ready']}/{report['total']}")
          for item in report['pending'][:100]:
              print(f"- {item['language']}/{item['source_key']}: {item['status']}")
          PY

      - name: Preserve publication completeness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-sync-report
          path: ${{ runner.temp }}/docs-sync-report.json
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Docs/package-lock.json

      - name: Validate MDX and local links before pushing
        working-directory: Docs
        run: |
          npm ci --ignore-scripts
          node scripts/validate_mdx.mjs .

      - name: Check for changes
        id: changes
        working-directory: Docs
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "changed_services=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          changed_files=$(git diff --cached --name-only)
          git diff --cached --stat

          changed_services=$(echo "$changed_files" \
            | grep -oP '^(?:openapi/|[^/]+/guides/|[^/]+/mcp/)\K[^/.]+' \
            | sort -u \
            | tr '\n' ',' \
            | sed 's/,$//' || true)
          echo "changed_services=$changed_services" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        id: commit
        if: steps.changes.outputs.changed == 'true'
        working-directory: Docs
        run: |
          git config user.name "Ace Data Cloud Dev"
          git config user.email "dev@acedata.cloud"
          latest=$(git -C ../PlatformBackend ls-remote origin refs/heads/main | cut -f1)
          test "$latest" = "${{ steps.backend.outputs.sha }}" || {
            echo "::error::PlatformBackend advanced during publication; retry from current main."
            exit 1
          }
          git commit -m "docs: sync from PlatformBackend [automated]" \
            -m "Source: ${{ steps.backend.outputs.sha }}"
          git push
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require complete publication
        if: steps.publication.outputs.incomplete == 'true'
        run: |
          echo "::error::Publication is incomplete. Current pages were refreshed; retained or missing translations are listed in docs-sync-report."
          exit 1
