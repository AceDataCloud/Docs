name: Sync Docs from PlatformBackend

on:
  repository_dispatch:
    types: [sync-docs]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      changed_services: ${{ steps.changes.outputs.changed_services }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - name: Checkout Docs repo
        uses: actions/checkout@v4
        with:
          path: Docs
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Checkout PlatformBackend
        uses: actions/checkout@v4
        with:
          repository: AceDataCloud/PlatformBackend
          path: PlatformBackend
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run sync script
        working-directory: Docs
        run: |
          python -u scripts/sync_from_platformbackend.py \
            --backend-dir ../PlatformBackend \
            --output-dir .

      - name: Check for changes
        id: changes
        working-directory: Docs
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "changed_services=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          changed_files=$(git diff --cached --name-only | head -300)
          echo "Files changed:"
          echo "$changed_files"

          changed_services=$(echo "$changed_files" \
            | grep -oP '^(?:openapi/|[^/]+/guides/|[^/]+/mcp/)\K[^/.]+' \
            | sort -u \
            | tr '\n' ',' \
            | sed 's/,$//' || true)
          echo "changed_services=$changed_services" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        id: commit
        if: steps.changes.outputs.changed == 'true'
        working-directory: Docs
        run: |
          git config user.name "Ace Data Cloud Dev"
          git config user.email "dev@acedata.cloud"
          git commit -m "docs: sync from PlatformBackend [automated]"
          git push
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  dispatch:
    needs: sync
    if: needs.sync.outputs.changed == 'true' && needs.sync.outputs.changed_services != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: AceDataCloud/MCPs
            services: all
          - repo: AceDataCloud/Clis
            services: all
          - repo: AceDataCloud/APIs
            services: all
          - repo: AceDataCloud/Skills
            services: all
          - repo: AceDataCloud/SDK
            services: all
    steps:
      - name: Check if service is relevant
        id: check
        run: |
          changed="${{ needs.sync.outputs.changed_services }}"
          target="${{ matrix.services }}"
          if [ "$target" = "all" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          elif echo ",$changed," | grep -q ",$target,"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.repo }} — '$target' not in '$changed'"
          fi

      - name: Dispatch to downstream repo
        if: steps.check.outputs.relevant == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          repository: ${{ matrix.repo }}
          event-type: docs-updated
          client-payload: |
            {
              "commit_sha": "${{ needs.sync.outputs.commit_sha }}",
              "changed_services": "${{ needs.sync.outputs.changed_services }}",
              "source": "Docs-sync"
            }
