name: Sync Docs from PlatformBackend

on:
  repository_dispatch:
    types: [sync-docs]
  workflow_dispatch:
    inputs:
      force:
        description: "Force full regeneration"
        required: false
        default: "false"
        type: boolean
      skip_translate:
        description: "Skip translation step"
        required: false
        default: "false"
        type: boolean
  schedule:
    - cron: "0 6 * * *" # Daily at 6:00 UTC

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Docs repo
        uses: actions/checkout@v4
        with:
          path: Docs
          token: ${{ secrets.BOT_TOKEN }}

      - name: Checkout PlatformBackend
        uses: actions/checkout@v4
        with:
          repository: AceDataCloud/PlatformBackend
          path: PlatformBackend
          token: ${{ secrets.BOT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: Docs/.cache
          key: docs-cache-${{ hashFiles('Docs/scripts/*.py') }}-${{ github.run_number }}
          restore-keys: |
            docs-cache-${{ hashFiles('Docs/scripts/*.py') }}-
            docs-cache-

      - name: Run sync script (Chinese base content)
        timeout-minutes: 15
        env:
          ACEDATACLOUD_OPENAI_KEY: ${{ secrets.ACEDATACLOUD_OPENAI_KEY }}
        run: |
          echo "::group::Sync script output"
          cd Docs
          python -u scripts/sync.py \
            --backend-dir ../PlatformBackend \
            --output-dir .
          echo "::endgroup::"

      - name: Enhance content (optional)
        if: inputs.force == 'true'
        timeout-minutes: 20
        env:
          ACEDATACLOUD_OPENAI_KEY: ${{ secrets.ACEDATACLOUD_OPENAI_KEY }}
        run: |
          echo "::group::Enhance content"
          cd Docs
          python -u scripts/enhance_content.py --output-dir .
          echo "::endgroup::"

      - name: Translate to all languages
        if: inputs.skip_translate != 'true'
        timeout-minutes: 45
        env:
          ACEDATACLOUD_OPENAI_KEY: ${{ secrets.ACEDATACLOUD_OPENAI_KEY }}
        run: |
          echo "::group::Translation output"
          cd Docs
          # Only translate root-level MDX files (intro, quickstart, auth) and
          # generated static pages that don't come from PlatformBackend.
          # PlatformBackend translations are already copied by sync.py step 6b.
          python -u scripts/translate_content.py --output-dir . --root-only
          echo "::endgroup::"

      - name: Check for changes
        id: changes
        working-directory: Docs
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # Capture changed files
            changed_files=$(git diff --cached --name-only | head -200)
            echo "Files changed:"
            echo "$changed_files"
            # Extract changed services from file paths (guides/suno/*, openapi/suno.json, mcp/suno.mdx)
            changed_services=$(echo "$changed_files" | grep -oP '(?:guides|openapi|mcp)/\K[^/.]+' | sort -u | tr '\n' ',' | sed 's/,$//')
            echo "changed_services=$changed_services" >> "$GITHUB_OUTPUT"
            # Store changed files list for dispatch
            echo "$changed_files" > /tmp/changed_files.txt
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        working-directory: Docs
        run: |
          git config user.name "Ace Data Cloud Dev"
          git config user.email "dev@acedata.cloud"
          git commit -m "docs: sync from PlatformBackend (zh-CN base + translations) [automated]"
          git push

      - name: Generate diff summary
        if: steps.changes.outputs.changed == 'true'
        id: diff
        working-directory: Docs
        run: |
          # Get the diff of the just-pushed commit (only zh-CN base, no translated files)
          diff_summary=$(git diff HEAD~1 HEAD --stat -- \
            'openapi/*.json' 'guides/**' 'mcp/*.mdx' \
            'introduction.mdx' 'quickstart.mdx' 'authentication.mdx' \
            | head -50)
          # Get detailed diff for zh-CN content only (not translations)
          diff_detail=$(git diff HEAD~1 HEAD -- \
            'openapi/*.json' 'guides/**' 'mcp/*.mdx' \
            | head -500)
          # Save to files (to avoid shell escaping issues in outputs)
          echo "$diff_summary" > /tmp/diff_summary.txt
          echo "$diff_detail" > /tmp/diff_detail.txt
          # Get commit SHA
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      changed_services: ${{ steps.changes.outputs.changed_services }}
      commit_sha: ${{ steps.diff.outputs.commit_sha }}

  dispatch:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        include:
          - repo: AceDataCloud/MCPs
            services: all
          - repo: AceDataCloud/Clis
            services: all
          - repo: AceDataCloud/APIs
            services: all
          - repo: AceDataCloud/Skills
            services: all
    steps:
      - name: Check if service is relevant
        id: check
        run: |
          changed="${{ needs.sync.outputs.changed_services }}"
          target="${{ matrix.services }}"
          if [ "$target" = "all" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          elif echo "$changed" | grep -qw "$target"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.repo }} — service '$target' not in changed: '$changed'"
          fi

      - name: Dispatch to downstream repo
        if: steps.check.outputs.relevant == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.BOT_TOKEN }}
          repository: ${{ matrix.repo }}
          event-type: docs-updated
          client-payload: |
            {
              "commit_sha": "${{ needs.sync.outputs.commit_sha }}",
              "changed_services": "${{ needs.sync.outputs.changed_services }}",
              "source": "Docs"
            }
