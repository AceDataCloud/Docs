name: Validate native n8n examples
on:
  pull_request:
    paths:
      - 'examples/n8n/read-*-task.json'
      - 'scripts/n8n/**'
      - '.github/workflows/n8n-native-examples.yml'
permissions:
  contents: read
jobs:
  import-and-check-credential-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: suno
            version: '0.1.3'
          - service: seedance
            version: '0.1.3'
          - service: happyhorse
            version: '0.1.2'
          - service: gpt-image
            version: '0.1.2'
          - service: nano-banana
            version: '0.1.2'
    steps:
      - uses: actions/checkout@v4
      - name: Install published node and import the exact guide workflow
        env:
          SERVICE: ${{ matrix.service }}
          PACKAGE_VERSION: ${{ matrix.version }}
        run: bash scripts/n8n/smoke-native-examples.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n8n-guide-${{ matrix.service }}
          path: artifacts/
