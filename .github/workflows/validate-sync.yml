name: Validate docs sync

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test generated-content safeguards
        env:
          PUBLIC_EXAMPLE_DENYLIST: ${{ secrets.PUBLIC_EXAMPLE_DENYLIST }}
        run: |
          python -m compileall -q scripts tests
          python -m unittest
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/mdx-validation.test.mjs
      - name: Test GitLab component source
        run: ruby examples/gitlab/acedatacloud-chat-component/tests/verify_component.rb
