name: Validate docs sync

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test generated-content safeguards
        env:
          PUBLIC_EXAMPLE_DENYLIST: ${{ secrets.PUBLIC_EXAMPLE_DENYLIST }}
        run: |
          python -m py_compile scripts/sync_from_platformbackend.py tests/test_sync_from_platformbackend.py
          python tests/test_sync_from_platformbackend.py
